# Stash UI plugin manifest for Jasna switchable playback.
# Filename (minus .yml) is the plugin id: jasna-switch. See README.md.

name: Jasna Switch
description: >
  Adds a JASNA ON/OFF toggle to the Stash scene player, allowing
  Jasna-restored playback to be swapped in as an alternate rendition
  of the current scene without modifying Stash itself.
version: 0.3.4

ui:
  javascript:
    # Stash's bundled video.js has no HLS source handler (verified
    # 2026-09-08: player.src() with an .m3u8 URL stalls forever in
    # Chrome, then errors MEDIA_ERR_SRC_NOT_SUPPORTED on player.load()).
    # hls.js is attached directly to the raw <video> element instead,
    # the same approach Jasna's own reference UI uses. Bundled copy of
    # hls.js 1.7.2 (dist/hls.min.js, Apache-2.0) so no CDN or script-src
    # CSP exception is needed.
    - hls.min.js
    - jasna-switch.js

  # Jasna typically runs on a different host/port than Stash, so its
  # origin must be allow-listed for fetch()/XHR to succeed. Add the origin
  # you configure as "Jasna URL" below. If Stash is served over HTTPS the
  # Jasna origin must be HTTPS too (browsers block mixed content); a
  # plain-HTTP Stash can use Jasna's own http port directly.
  # Not needed when the bridge is served under the Stash domain (Bridge URL
  # "/jasna"): 'self' covers it. Only absolute Bridge/Jasna URLs need an entry.
  csp:
    connect-src:
      - http://192.168.11.113:8770
      - http://192.168.11.113:8765

settings:
  bridgeUrl:
    displayName: Bridge URL
    description: >
      URL of stash-jasna-bridge. Relative ("/jasna") when it is served under
      the Stash domain by the reverse proxy, or absolute
      (http://192.168.11.113:8770) for a plain-HTTP Stash. When set, the
      plugin uses the bridge (session ownership, idle timeout, HLS proxy)
      and ignores Jasna URL. An absolute URL must also be in this plugin's
      CSP connect-src.
    type: STRING
  bridgeToken:
    displayName: Bridge token
    description: >
      Shared secret for bridge auth.mode = token (sent as Authorization:
      Bearer). Leave empty for none / stash_cookie modes.
    type: STRING
  jasnaUrl:
    displayName: Jasna URL
    description: >
      Base URL of the Jasna --stream server, e.g. http://192.168.11.113:8765
      (or the HTTPS proxy in front of it when Stash itself is HTTPS). Must
      also be listed in this plugin's CSP connect-src. Leave empty to use the
      default compiled into jasna-switch.js.
    type: STRING
