name: Collection Colors
description: >
  Adds a "pill" to the scene-cards that corresponds to their configured Library path.
version: 1.0.2
settings:
  collectionColors:
    displayName: Collection colors (raw JSON)
    description: >
      Auto-generated JSON mapping each configured Library path to a hex
      color. Edit via the color picker in this section instead of this
      raw field directly — it's kept in sync automatically.
    type: STRING
  popoverPriority:
    displayName: Scene card popover button priority
    description: >
      Comma-separated priority order for the scene-card popovers row 
      Known keys: performer-count, count-button,
      marker-count, tag-count, group-count, organized, other-copies.
    type: STRING
  pillStyle:
    displayName: Collection pill style
    description: >
      "Default" is transparent with just a colored border 
      and text. "Solid" fills the pill with the collection's color and picks black or
      white text automatically for contrast. Any other value falls back to outline.
    type: STRING
ui:
  javascript:
    - collection-colors.js
  css:
    - collection-colors.css
