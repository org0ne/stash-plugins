name: Collection Colors
description: >
  Colors scene cards by which configured Library path they live under —
  auto-discovered from Settings > Library, no hardcoded paths. Per-folder
  colors are editable via a picker injected into this plugin's own
  Settings > Plugins section.
version: 1.0.0
settings:
  collectionColors:
    displayName: Collection colors (raw JSON)
    description: >
      Auto-generated JSON mapping each configured Library path to a hex
      color. Edit via the color picker in this section instead of this
      raw field directly — it's kept in sync automatically.
    type: STRING
  popoverPriority:
    displayName: Scene card popover button priority
    description: >
      Comma-separated priority order for the native icons on the right
      side of the scene-card popover row (rating/tag/performer counts,
      organized flag, etc) — the collection pill itself is a fixed left
      anchor and isn't part of this list. On a card too narrow to show
      every icon, the lowest-priority ones are hidden first rather than
      wrapping to a second line. Known keys: performer-count, count-button,
      marker-count, tag-count, group-count, organized, other-copies.
      Unknown keys are ignored; omitted known keys still appear, just
      last, after every key you listed. Default:
      performer-count,count-button,marker-count,tag-count,group-count,organized,other-copies
    type: STRING
  pillStyle:
    displayName: Collection pill style
    description: >
      How the collection pill is drawn: "outline" (default) leaves the
      pill transparent with just a colored border and text, so it can
      never be mistaken for a themed action button. "solid" instead
      fills the pill with the collection's color and picks black or
      white text automatically for contrast, matching stash's own
      native tag chips. Any other value falls back to outline.
    type: STRING
ui:
  javascript:
    - collection-colors.js
  css:
    - collection-colors.css
